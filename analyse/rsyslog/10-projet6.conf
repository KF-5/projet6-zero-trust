# 10-projet6.conf - Configuration rsyslog sur le collecteur (10.99.0.10)
# Reçoit les logs syslog UDP et TCP sur le port 514

module(load="imudp")
input(type="imudp" port="514") # syslog UDP (cible configurée dans OPNsense)

module(load="imtcp")
input(type="imtcp" port="514") # syslog TCP : moins de pertes pendant un flood (écart E13)

# RSYSLOG_FileFormat : horodatage complet (date, microsecondes, fuseau), indispensable au calcul du TTD
template(name="P6Format" type="string" string="%TIMESTAMP:::date-rfc3339% %HOSTNAME% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

# Classement par adresse IP source dans /var/log/p6/<adresse>.log (mise à jour du 17 novembre)
# et compatibilité avec /var/log/remote/
if ($fromhost-ip == "10.99.0.1") then {
    action(type="omfile" file="/var/log/p6/10.99.0.1.log" template="RSYSLOG_FileFormat")
    action(type="omfile" file="/var/log/remote/opnsense.log" template="RSYSLOG_FileFormat")
    stop
}

if ($fromhost-ip == "10.99.0.20") then {
    action(type="omfile" file="/var/log/p6/10.99.0.20.log" template="RSYSLOG_FileFormat")
    action(type="omfile" file="/var/log/remote/docker.log" template="RSYSLOG_FileFormat")
    stop
}

if ($fromhost-ip == "10.99.0.66") then {
    action(type="omfile" file="/var/log/p6/10.99.0.66.log" template="RSYSLOG_FileFormat")
    action(type="omfile" file="/var/log/remote/kali.log" template="RSYSLOG_FileFormat")
    stop
}
