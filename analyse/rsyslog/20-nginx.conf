# 20-nginx.conf - Hôte Docker (p6-docker 10.99.0.20)
# Envoie le journal d'accès de nginx vers le collecteur (10.99.0.10) en TCP 514

module(load="imfile")

input(type="imfile"
      File="/srv/logs/nginx/projet6.log"
      Tag="nginx:"
      Facility="local6")

# Envoi vers le collecteur via TCP pour éviter les pertes pendant les pics de charge (écart E13)
local6.* action(type="omfwd"
                target="10.99.0.10"
                port="514"
                protocol="tcp")
